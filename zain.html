<section style="background:var(--card)"><div class="w"><h2>${t("rv")}</h2><div class="rev">${(lang=="ar"?[["أحمد م.","وصلني الجهاز في يومين وكان مغلفًا بالكامل. تعامل ممتاز."],["سارة ع.","السعر أقل من أي مكان تاني، والضمان واضح من أول يوم."],["كريم ح.","استبدلت الجهاز بسهولة. خدمة العملاء ردت على واتساب فورًا."]]:[["Ahmed M.","Arrived in two days, sealed box. Great experience."],["Sara A.","Cheaper than anywhere else, warranty is clear."],["Karim H.","Exchange was easy and WhatsApp support replied instantly."]]).map(r=>`<div><span class="st">★★★★★</span><p>${r[1]}</p><b>${r[0]}</b></div>`).join("")}</div></div></section>
<section id="about"><div class="w"><h2>${t("nav")[4]}</h2><p style="max-width:62ch">${t("about")}</p><br><div class="nl"><h2 style="margin:0">${t("nl")}</h2><p>${t("nlp")}</p><form onsubmit="nlSub(event)"><input type="email" required placeholder="email@example.com" aria-label="email"><button class="btn">${t("sub2")}</button></form></div></div></section>
<footer id="contact"><div class="w"><div><h4>ZAIN – زين</h4>${t("ct")}</div><div><h4>${lang=="ar"?"فروعنا":"Our branches"}</h4>1. مطروح - العلمين - أول شارع المدارس (الفرع الرئيسي)<br>2. مطروح - العلمين - بورتو جولف - المشاية بجوار كافيه تريبل<br>3. مطروح - العلمين - بورتو مارينا 3<br>4. مطروح - الضبعة - مول 1 محطة الضبعة النووية</div><div><h4>${t("nav")[1]}</h4><a href="#shop">${t("ph")}</a><a href="#acc">${t("nav")[2]}</a><a href="#deals">${t("nav")[3]}</a></div><div><h4>${lang=="ar"?"تابعنا":"Follow us"}</h4><a href="#">Instagram</a><a href="#">Facebook</a><a href="#">TikTok</a><a href="#" onclick="admin();return false">${t("adm")}</a></div><div>${t("rights")}</div></div></footer>`;
cnt()}
function gl(){$("#gl").innerHTML=list().map(card).join("")}
function setC(c){F.c=c=="phone"?"":c;render()}
function cnt(){$("#cc").textContent=cart.reduce((a,x)=>a+x.q,0);$("#wc").textContent=wish.length}
function tw(id){wish=wish.includes(id)?wish.filter(x=>x!=id):[...wish,id];save();render()}
function add(id,o={}){const p=P.find(x=>x.id==id),k=id+"|"+(o.c||p.c[0])+"|"+(o.s||p.s[0]);const e=cart.find(x=>x.k==k);if(e)e.q=Math.min(p.st,e.q+(o.q||1));else cart.push({k,id,c:o.c||p.c[0],s:o.s||p.s[0],q:o.q||1});save();cnt();toast(t("ok")+" ✓");closeM()}
function openM(h){$("#md").innerHTML=`<button class="x" onclick="closeM()" aria-label="close">×</button>`+h;$("#ov").classList.add("on")}
function closeM(){$("#ov").classList.remove("on")}$("#ov").onclick=e=>{if(e.target.id=="ov")closeM()};
let sel={};
function det(id){const p=P.find(x=>x.id==id);sel={c:p.c[0],s:p.s[0],q:1};const rel=P.filter(x=>x.id!=id&&x.cat==p.cat).slice(0,3);
openM(`<div class="dt"><div class="pic" id="dp">${phone(sel.c,p.img)}</div><div><span class="br">${p.b}</span><h2 style="margin:0 0 6px">${p.n}</h2><span class="st">${stars(p.r)} ${p.r}</span><p style="margin:8px 0"><button class="btn k" onclick="ask(${p.id})">💬 ${t("ask")}</button></p>
<p style="font-size:14px;color:var(--mu)">${lang=="ar"?"شاشة متطورة وأداء سريع وكاميرا احترافية وبطارية تدوم يومًا كاملًا.":"Brilliant display, fast performance, pro camera and all-day battery."}</p>
<b>${t("cl")}</b><div class="opt">${p.c.map(c=>`<button class="sw ${c==sel.c?"on":""}" style="background:${c}" title="${COL[c]||""}" onclick="sel.c='${c}';$('#dp').innerHTML=phone('${c}','${p.img}');this.parentNode.querySelectorAll('button').forEach(b=>b.classList.remove('on'));this.classList.add('on')"></button>`).join("")}</div>
${p.s[0]?`<b>${t("stg")}</b><div class="opt">${p.s.map(s=>`<button class="${s==sel.s?"on":""}" onclick="sel.s=${s};this.parentNode.querySelectorAll('button').forEach(b=>b.classList.remove('on'));this.classList.add('on')">${s} GB</button>`).join("")}</div>`:""}
<div class="opt" style="align-items:center"><span class="qt"><button onclick="sq(-1)">−</button><span id="sqn">1</span><button onclick="sq(1,${p.st})">+</button></span><button class="btn" style="flex:1" ${p.st?"":"disabled"} onclick="add(${p.id},sel)">${t("add")}</button></div>
<small>🛡 ${t("wr")}</small></div></div>
<table><tr><th>${lang=="ar"?"المواصفات":"Specs"}</th><th></th></tr><tr><td>${t("ram")}</td><td>${p.ram?p.ram+" GB":"—"}</td></tr><tr><td>${lang=="ar"?"الشاشة":"Display"}</td><td>${p.cat=="phone"?"6.7″ OLED 120Hz":"—"}</td></tr><tr><td>${lang=="ar"?"البطارية":"Battery"}</td><td>${p.cat=="phone"?"5000 mAh":"—"}</td></tr></table>
<h4>${t("rel")}</h4><div class="grid" style="grid-template-columns:repeat(3,1fr)">${rel.map(r=>`<div class="card" onclick="det(${r.id})" style="cursor:pointer"><div class="pic" style="aspect-ratio:1.4">${phone(r.c[0],r.img)}</div><span class="nm" style="font-size:14px">${r.n}</span></div>`).join("")}</div>`)}
function sq(d,m){sel.q=Math.max(1,Math.min(m||99,sel.q+d));$("#sqn").textContent=sel.q}
function totals(){const sub=cart.reduce((a,x)=>a+pr(P.find(p=>p.id==x.id))*x.q,0),ds=code?sub*code:0,sh=sub-ds>=30000||!sub?0:100;return{sub,ds,sh,tot:sub-ds+sh}}
function drawer(h){$("#dr").innerHTML=h;$("#dr").classList.add("on")}
function closeD(){$("#dr").classList.remove("on")}
function openCart(){cart=cart.filter(x=>P.find(p=>p.id==x.id));const T=totals();
drawer(`<div style="display:flex;justify-content:space-between"><h2 style="margin:0">${t("cart")}</h2><button onclick="closeD()" style="font-size:26px">×</button></div>
${cart.length?cart.map((x,i)=>{const p=P.find(q=>q.id==x.id);return`<div class="ci">${phone(x.c,p.img)}<div><b>${p.n}</b><br>${x.s?x.s+" GB":""}<br><span class="qt"><button onclick="cq(${i},-1)">−</button>${x.q}<button onclick="cq(${i},1)">+</button></span></div><button onclick="cart.splice(${i},1);save();openCart();cnt()" aria-label="${t("rm")}">🗑</button></div>`}).join(""):`<p style="margin:30px 0;color:var(--mu)">${t("empty")}</p>`}
${cart.length?`<button class="btn f" style="margin-top:14px" onclick="chk()">${t("chk")}</button>`:""}`)}
function cq(i,d){const p=P.find(x=>x.id==cart[i].id);cart[i].q=Math.max(1,Math.min(p.st,cart[i].q+d));save();openCart();cnt()}
function cd(e){e.preventDefault();if($("#cdi").value.trim().toUpperCase()=="ZAIN10"){code=.1;toast(t("ok"))}else toast(t("bad2"));openCart()}
function openWish(){drawer(`<div style="display:flex;justify-content:space-between"><h2 style="margin:0">${t("wl")}</h2><button onclick="closeD()" style="font-size:26px">×</button></div>${wish.length?wish.map(id=>{const p=P.find(x=>x.id==id);return p?`<div class="ci">${phone(p.c[0],p.img)}<div><b>${p.n}</b><br>${fm(pr(p))}</div><button class="btn" style="padding:6px 14px" onclick="add(${p.id});openWish()">+</button></div>`:""}).join(""):`<p style="color:var(--mu);margin-top:30px">♡</p>`}`)}
function chk(){closeD();const T=totals();openM(`<h2>${t("chk")}</h2><form class="f" onsubmit="place(event)" novalidate><label>${t("name")}<input name="n" autocomplete="name"></label><div class="er" data-e="n"></div><label>${t("phone")}<input name="p" inputmode="tel" autocomplete="tel" placeholder="01XXXXXXXXX"></label><div class="er" data-e="p"></div><label>${t("addr")}<textarea name="a" rows="2"></textarea></label><div class="er" data-e="a"></div><label>${t("pay")}<select name="m"><option>${t("cod")}</option><option>${t("card")}</option></select></label><button class="btn f" id="pb">${t("place")}</button></form>`)}
function place(e){e.preventDefault();const f=e.target,v={n:esc(f.n.value.trim()).slice(0,60),p:f.p.value.trim().slice(0,11),a:esc(f.a.value.trim()).slice(0,200)};const bad={n:v.n.length<3,p:!/^01[0-25]\d{8}$/.test(v.p),a:v.a.length<8};f.querySelectorAll(".er").forEach(x=>x.textContent=bad[x.dataset.e]?t("bad"):"");if(Object.values(bad).some(Boolean))return;
const T=totals(),b=$("#pb");b.disabled=true;b.textContent="…";setTimeout(()=>{const o={id:"ZN"+(1000+orders.length+1),cu:v.n,ph:v.p,ad:v.a,tot:T.tot,st:0,items:cart.map(x=>({id:x.id,q:x.q})),d:new Date().toISOString().slice(0,10)};cart.forEach(x=>{const p=P.find(q=>q.id==x.id);if(p)p.st=Math.max(0,p.st-x.q)});orders.push(o);cart=[];code=null;save();render();openM(`<div style="text-align:center;padding:30px"><div style="font-size:56px">✅</div><h2>${t("thanks")}</h2><p>#${o.id}</p><br><a class="btn" target="_blank" rel="noopener" href="${waLink(o)}">${t("wa2")}</a></div>`)},700)}
const NUM="201019402015";
function waLink(o){const m=`${o.id}\n`+o.items.map(i=>{const p=P.find(x=>x.id==i.id);return(p?p.n:"")+" ×"+i.q}).join("\n")+`\n${o.cu} - ${o.ph}\n${o.ad}`;return"https://wa.me/"+NUM+"?text="+encodeURIComponent(m)}
function ask(id){const p=P.find(x=>x.id==id);window.open("https://wa.me/"+NUM+"?text="+encodeURIComponent((lang=="ar"?"أريد الاستفسار عن: ":"I would like to ask about: ")+p.n),"_blank")}
function pimg(i,el){const f=el.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>{const c=document.createElement("canvas"),s=Math.min(1,600/Math.max(im.width,im.height));c.width=im.width*s;c.height=im.height*s;c.getContext("2d").drawImage(im,0,0,c.width,c.height);P[i].img=c.toDataURL("image/jpeg",.8);save();render();admin();toast(t("ok")+" ✓")};im.src=r.result};r.readAsDataURL(f)}
function nlSub(e){e.preventDefault();e.target.reset();toast(t("ok")+" ✓")}
let tries=0;async function askPw(){if(tries>=3){toast("Locked");return}const p=prompt(t("lock"));if(!p)return;const h=[...new Uint8Array(await crypto.subtle.digest("SHA-256",new TextEncoder().encode(p)))].map(b=>b.toString(16).padStart(2,"0")).join("");if(h=="70a78a3835ce44e9f9da782bf9091864c0ab19ebb1ae2862fc5f85cf36f7b5a0"){adm=true;tries=0;admin()}else{tries++;toast(t("bad"))}}
function admin(){if(!adm){askPw();return}
const rev=orders.reduce((a,o)=>a+o.tot,0),cu=[...new Set(orders.map(o=>o.ph))].length;
openM(`<h2>${t("adm")}</h2><div class="kp"><div><b>${fm(rev)}</b>${t("sales")}</div><div><b>${orders.length}</b>${t("ords")}</div><div><b>${cu}</b>${t("cust")}</div><div><b>${P.reduce((a,p)=>a+p.st,0)}</b>${t("stock")}</div></div>
<h4>${t("ords")}</h4><div class="tb"><table>${orders.length?orders.map((o,i)=>`<tr><td>${o.id}</td><td>${o.cu}<br><small>${o.ph}</small></td><td>${fm(o.tot)}</td><td><select onchange="orders[${i}].st=+this.value;save()">${t("st").map((s,j)=>`<option value="${j}" ${o.st==j?"selected":""}>${s}</option>`).join("")}</select></td></tr>`).join(""):"<tr><td>—</td></tr>"}</table></div>
<h4>${t("prods")}</h4><div class="tb"><table>${P.map((p,i)=>`<tr><td>${p.n}</td><td><input type="number" value="${p.p}" style="width:90px" onchange="P[${i}].p=+this.value;save()" aria-label="${t("pp")}"></td><td><input type="number" value="${p.d}" min="0" max="90" style="width:56px" onchange="P[${i}].d=+this.value;save()" aria-label="${t("pd")}">%</td><td><input type="number" value="${p.st}" min="0" style="width:60px" onchange="P[${i}].st=+this.value;save()" aria-label="${t("stock")}"></td><td><input type="file" accept="image/*" style="width:100px" onchange="pimg(${i},this)" aria-label="${t("img")}"></td><td><button onclick="P.splice(${i},1);save();admin();render()">🗑</button></td></tr>`).join("")}</table></div>
<h4>${t("newp")}</h4><form class="f" onsubmit="np(event)"><input name="n" required placeholder="${t("pn")}"><input name="b" required placeholder="Brand" list="bl"><datalist id="bl">${[...new Set(P.map(p=>p.b))].map(b=>`<option>${b}</option>`).join("")}</datalist><input name="p" type="number" min="1" required placeholder="${t("pp")}"><input name="d" type="number" min="0" max="90" value="0"><input name="s" type="number" min="0" value="10"><select name="c"><option value="phone">${t("ph")}</option><option value="acc">${t("nav")[2]}</option></select><label>${t("img")}<input name="i" type="file" accept="image/*"></label><br><button class="btn f">${t("save")}</button></form>`)}
function np(e){e.preventDefault();const f=e.target,go=img=>{P.push({id:Date.now(),n:esc(f.n.value.trim()).slice(0,80),b:esc(f.b.value.trim()).slice(0,40),p:+f.p.value,d:+f.d.value,r:4.5,c:["#111"],s:[f.c.value=="phone"?128:0],ram:f.c.value=="phone"?8:0,st:+f.s.value,cat:f.c.value,img});save();render();admin();toast(t("ok")+" ✓")},fl=f.i.files[0];if(fl){const r=new FileReader();r.onload=()=>go(r.result);r.readAsDataURL(fl)}else go("")}
document.addEventListener("keydown",e=>{if(e.key=="Escape"){closeM();closeD()}});
render();
</script>
</body>
</html>
